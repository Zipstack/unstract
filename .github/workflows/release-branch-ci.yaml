name: Release branch CI

# Every commit after the cut must be a pick of a main commit (or its decline), release-branch-only, or
# build-generated. Anything else fails. Label `release-branch-only` passes a PR with commits of any kind.
# A backport/X.Y/<sha7> PR is judged by its first commit: the squash keeps its trailer.
# Known limit: a PR can edit this file for its own pull_request run, which holds no secret.
on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["release/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled] # the label changes the verdict

# A PR's newest event's run reports: an older run of a label swap can read the labels mid-swap. Pushes are not grouped.
concurrency:
  group: release-branch-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # the PR's live labels: a private repo refuses the issues API for a PR without it

jobs:
  check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.state != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Classifier read from main, so a PR cannot weaken relmgr.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .relmgr
          sparse-checkout: .github/release
          persist-credentials: false

      # Live labels, not the event's: a label swap fires one run per event, and an earlier event's payload is stale.
      - name: Labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          rbo=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels?per_page=100" --jq 'any(.[]; .name == "release-branch-only")') ||
            { echo "::error title=Release branch CI::could not read this PR's labels from the API; re-run the job"; exit 1; }
          echo "rbo=$rbo" >> "$GITHUB_OUTPUT"

      - name: Check commit kinds
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RBO_LABEL: ${{ steps.labels.outputs.rbo == 'true' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 -I - <<'PY'  # isolated: a module file in the head checkout never shadows the stdlib
          import os, sys
          sys.path.insert(0, ".relmgr/.github/release")
          import relmgr as rm
          repo, branch = os.environ["GITHUB_WORKSPACE"], f"origin/{os.environ['BRANCH']}"
          try:
              rows, where = rm.ci_commits(repo, branch, os.environ["EVENT"], os.environ["BEFORE"], os.environ["HEAD_REF"],
                                          os.environ["RBO_LABEL"] == "true")
          except ValueError as e:
              sys.exit(f"::error::{e}")
          for c, kind in rows:
              print(f"{'::error::' if kind == 'invalid' else ''}{c[:12]} {kind:20} {rm.git(repo, 'log', '-1', '--format=%s', c)}")
          bad = sum(kind == "invalid" for _, kind in rows)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"invalid={bad}\npicks={' '.join(c for c, kind in rows if kind == 'cherry-pick')}\n")
          sys.exit(f"{bad} invalid commit(s) on {where}" if bad else 0)
          PY

      - name: Merge note
        if: always() && github.event_name == 'pull_request'
        env:
          RBO_LABEL: ${{ steps.labels.outputs.rbo == 'true' }}
          INVALID: ${{ steps.classify.outputs.invalid || '0' }}
          OUTCOME: ${{ steps.classify.outcome }}
        run: |
          if [ "$INVALID" != 0 ]; then
            hint="A commit here is not a pick from main. A change only for $BRANCH: add the \`release-branch-only\` label. A fix on main: cherry-pick it with \`git cherry-pick -x\`."
            echo "::notice::$hint"
            echo "$hint" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OUTCOME" != success ]; then
            echo "The commit check failed or did not run; see the job log. Do not merge until it passes." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RBO_LABEL" = true ]; then
            echo "Squash and merge: the \`Release-branch-only: <TICKET>\` commit the bot added carries the line." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merge with squash; the squash message keeps each commit's trailer (a backport PR's from its first commit)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Branch state (informational)
        if: always()
        continue-on-error: true
        run: python3 .relmgr/.github/release/relstate.py | jq --arg b "$BRANCH" '.branches[] | select(.branch == $b)'

      # A job cancelled by its timeout skips this step: failure() is false then.
      - name: Alert
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INVALID: ${{ steps.classify.outputs.invalid }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::No alert sent: secret SLACK_WEBHOOK_URL is not set"
            exit 0
          fi
          if [ "${INVALID:-0}" != 0 ]; then
            cause="$INVALID invalid commit(s)"
          else
            cause="the commit check failed or did not run"
          fi
          text=":red_circle: Release branch CI failed on \`$BRANCH\` (OSS) after a push: $cause. $RUN_URL"
          jq -n --arg text "$text" '{text: $text}' | curl -sS --fail-with-body --max-time 30 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
