name: Release branch CI

# Every commit after the cut must be a pick of a main commit (or its decline), release-branch-only, or
# build-generated. Anything else fails.
# PR into release/**: required check `check` over the PR's commits; a backport/X.Y/<sha7> PR is judged by its
# first commit (the squash keeps its trailer), and conflict markers fail it. A PR run holds no secret.
# Push: backstop for bot pushes.
# Label `release-branch-only`: the PR passes with commits of any kind; release-branch-only.yaml adds the
# `Release-branch-only: <TICKET>` commit to its head.
# Known limit: a branch cut before these triggers existed gets no PR check; a PR can edit this file for its own
# pull_request run.
# Label changes on a closed PR run nothing. No push builds an RC: a security or critical pick waits for Take RC build.
on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: ["release/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled] # the label changes the verdict

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.state != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # relmgr needs full history and tags
          persist-credentials: false # the head is only read

      # Classifier read from main, so a PR cannot weaken relmgr. Known limit: a PR can still edit this workflow
      # (needs a required workflow or CODEOWNERS on .github/).
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .relmgr
          sparse-checkout: .github/release
          persist-credentials: false

      - name: Check commit kinds
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RBO_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release-branch-only') }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 -I - <<'PY'  # isolated: a module file in the head checkout never shadows the stdlib
          import os, sys
          sys.path.insert(0, ".relmgr/.github/release")
          import relmgr as rm
          repo, branch = os.environ["GITHUB_WORKSPACE"], f"origin/{os.environ['BRANCH']}"
          try:
              rows, where = rm.ci_commits(repo, branch, os.environ["EVENT"], os.environ["BEFORE"], os.environ["HEAD_REF"],
                                          os.environ["RBO_LABEL"] == "true")
          except ValueError as e:
              sys.exit(f"::error::{e}")
          for c, kind in rows:
              print(f"{'::error::' if kind == 'invalid' else ''}{c[:12]} {kind:20} {rm.git(repo, 'log', '-1', '--format=%s', c)}")
          bad = sum(kind == "invalid" for _, kind in rows)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"invalid={bad}\npicks={' '.join(c for c, kind in rows if kind == 'cherry-pick')}\n")
          sys.exit(f"{bad} invalid commit(s) on {where}" if bad else 0)
          PY

      - name: Merge note
        if: always() && github.event_name == 'pull_request'
        env:
          RBO_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release-branch-only') }}
          INVALID: ${{ steps.classify.outputs.invalid || '0' }}
          OUTCOME: ${{ steps.classify.outcome }}
        run: |
          if [ "$INVALID" != 0 ]; then
            hint="A commit here is not a pick from main. A change only for $BRANCH: add the \`release-branch-only\` label. A fix on main: cherry-pick it with \`git cherry-pick -x\`."
            echo "::notice::$hint"
            echo "$hint" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$OUTCOME" != success ]; then
            echo "The commit check failed or did not run; see the job log. Do not merge until it passes." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RBO_LABEL" = true ]; then
            echo "Squash and merge: the \`Release-branch-only: <TICKET>\` commit the bot added carries the line." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merge with squash; the squash message keeps each commit's trailer (a backport PR's from its first commit)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Branch state (informational)
        if: always()
        continue-on-error: true
        run: python3 .relmgr/.github/release/relstate.py | jq --arg b "$BRANCH" '.branches[] | select(.branch == $b)'

      # No alert on a failed push run: this repo has no release alert channel or webhook secret.
