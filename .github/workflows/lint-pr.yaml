name: Lint PR

# Every PR into main or a release branch needs a recognised `[TYPE]` title prefix, whatever its labels.
# A PR into main also needs one label: backport/rc, backport/ga or main-only.
# Release branches too: the release changelog is built from their PR titles.
# The backport class is only printed here; Backport recomputes it at pick time.
on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# The newest event's run reports: an older run of a label swap can read the labels mid-swap.
concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # the PR's live labels: a private repo refuses the issues API for a PR without it

jobs:
  lint-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Rule read from main, so a PR cannot weaken relmgr; it can still edit this workflow.
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: .github/release
          persist-credentials: false

      - name: Classify PR
        id: class
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f .github/release/relmgr.py ]; then
            echo "::notice title=Lint PR::skipped: main has no .github/release/relmgr.py yet"
            exit 0
          fi
          # Live labels, not the event's: a label swap fires one run per event, and an earlier event's payload is stale.
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels?per_page=100" --jq '[.[].name]') ||
            { echo "::error title=Lint PR::could not read this PR's labels from the API; re-run the job"; exit 1; }
          export LABELS
          python3 -I - <<'PY'  # isolated: no working-directory module shadows the stdlib
          import json, os, sys
          sys.path.insert(0, ".github/release")
          import relmgr
          try:  # advisory: main may predate it, and it must never break this check
              import label_advice as la
          except Exception as e:
              print(f"::notice title=Lint PR::label advice unavailable: {e}")
              la = None

          title, labels = os.environ["TITLE"], json.loads(os.environ["LABELS"])
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          # Two-argument calls: the rule comes from main, so they must work with main's relmgr before and after a change.
          errors = []
          try:
              cls = relmgr.pr_fix_class(title, labels) or "none"
          except ValueError as e:
              errors.append(str(e))
          # Also when the title failed, so one run names every error.
          if refusal := relmgr.release_only_refusal(os.environ["BASE"], labels):
              errors.append(refusal)
          if check := getattr(relmgr, "body_errors", None):  # main's relmgr may predate it
              errors += check(os.environ["BODY"], labels)
          slug, pr = os.environ["GITHUB_REPOSITORY"], int(os.environ["PR"])

          def lookup_advice(**kw):  # advisory only: a failed lookup never fails or passes the PR
              try:
                  return la.advise_pr(slug, pr, **kw) if la else None
              except Exception as e:
                  print(f"::notice title=Lint PR::label advice unavailable: {e}")
                  return None
          if errors:
              adv = lookup_advice()
              menu = "" if os.environ["BASE"].startswith("release/") else (
                     "A PR into main needs exactly one of these labels; the title type does not choose it:\n"
                     "- `backport/rc`: also copy it to the release lines still awaiting GA.\n"
                     "- `backport/ga`: also copy it to those lines; released lines get it only by a Backport run that names the line.\n"
                     "- `main-only`: keep it on main only.\n"
                     "A revert takes the label of the PR it reverts.\n")
              advice = f"Advice: {la.render(adv)}\n" if adv else ""
              msg = ("\n".join(errors) + "\n" + advice + menu +
                     "Title: `[TYPE] text` or `TICKET [TYPE] text` (e.g. `ABC-123 [FIX] ...`).")
              print("::error title=Lint PR::" + msg.replace("\n", "%0A"))  # workflow commands end at a raw newline
              summary.write(f"### Lint PR: failed\n\n{msg}\n")
              sys.exit(1)
          print(f"class={cls}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"class={cls}\n")
          summary.write(f"### Lint PR\n\nBackport class: `{cls}`\n")
          # Only a decided result is checked: a suggestion is the author's call.
          adv = lookup_advice(need_ga=False)
          if adv and adv["result"] == "decided" and adv["label"] and adv["label"] not in labels:
              warn = f"the advice is `{adv['label']}` ({adv['reason']}); this PR has {', '.join(labels) or 'no label'}"
              print(f"::warning title=Lint PR::{warn}")
              summary.write(f"\n⚠ {warn}\n")
          if cls != "none":
              summary.write("\nKeep this PR to the fix; a bundled fix cannot be cherry-picked.\n")
          PY
