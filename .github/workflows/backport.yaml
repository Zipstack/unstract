name: Backport
# Expressions have no substring, so a push run names the full sha.
run-name: >-
  ${{ github.event_name == 'pull_request_target'
      && format('record #{0}', github.event.pull_request.number)
      || format('picks {0}', inputs.commits || github.sha) }}

# Fixes reach stabilized lines only with patch_released_lines; a backport/rc fix also needs lines. Closing a pick PR
# declines it; the close comment is the reason. pull_request_target because GitHub runs no pull_request workflow
# on a PR that conflicts with its base; it runs the base line's copy of this file, checks out main and never runs
# head code.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed, reopened]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      commits:
        description: "Fixes to pick: PR numbers or SHAs, comma or space separated"
        type: string
        required: false
      patch_released_lines:
        description: "Also pick onto released (stabilized) lines; a backport/rc fix needs Lines"
        type: boolean
        default: false
      lines:
        description: "Only these lines X.Y, e.g. 0.186,0.188. Include every newer released line, or Promote blocks."
        type: string
        required: false

jobs:
  pick:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # = backport.py PICK_TIMEOUT
    permissions:
      contents: read
    concurrency:
      # Each dispatch has its own group, since it may carry patch_released_lines.
      # Known limit: concurrent runs race on a pick head and can open a duplicate PR.
      group: backport-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'rescan' }}
    env:
      PYTHONDONTWRITEBYTECODE: "1" # keeps the pick clone clean; the conflict path stages with `git add -u`
    steps:
      - name: Inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo '::error::Run this from main ("Use workflow from: main")'; exit 1; fi
          if [ -z "$COMMITS" ]; then echo "::error::Set commits: the PR numbers or SHAs to backport"; exit 1; fi

      # A GITHUB_TOKEN push or PR starts no workflow.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUSH_TO_MAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_TO_MAIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - name: Main tip
        # A late push run checks out its event sha as origin/main; rescan the real tip instead.
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12" # relstate uses dt.UTC (3.11+)

      - name: Branch state
        run: |
          # Scripts run from outside the tree: the pick checks out release branches, which predate them.
          cp .github/release/*.py "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/relstate.py" > "$RUNNER_TEMP/state.json"

      - name: Pick
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_BOT_APP_SLUG: ${{ steps.bot.outputs.app-slug }} # a leftover pick PR is squashed only if this App opened it
          COMMITS: ${{ inputs.commits }}
          PATCH_RELEASED_LINES: ${{ inputs.patch_released_lines }}
          LINES: ${{ inputs.lines }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then args=(--rescan); else args=(--commits="$COMMITS"); fi
          if [ "$PATCH_RELEASED_LINES" = true ]; then args+=(--patch-released-lines); fi
          python3 "$RUNNER_TEMP/backport.py" --state "$RUNNER_TEMP/state.json" "${args[@]}" --lines="$LINES"

  record:
    if: >-
      github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.head.ref, 'backport/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: backport-pr-${{ github.event.pull_request.number }} # its own group: in a pick group it could replace a pending pick run
    steps:
      # A GITHUB_TOKEN push or PR starts no workflow.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUSH_TO_MAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_TO_MAIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # the decline reads the pick from the head and the base's history
          token: ${{ steps.bot.outputs.token }}

      - name: Record the close
        # Every live line's copy of this job runs main's backport_merge.py, which must accept each copy's env and args.
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_BOT_APP_SLUG: ${{ steps.bot.outputs.app-slug }} # the pick PR's author must be this App
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
        run: python3 .github/release/backport_merge.py --pr "$PR" --sender "$SENDER"
