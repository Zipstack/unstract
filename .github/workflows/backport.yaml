name: Backport
# Expressions have no substring, so a push run names the full sha.
run-name: >-
  ${{ github.event_name == 'pull_request_target'
      && format('record #{0}', github.event.pull_request.number)
      || format('picks {0}', inputs.commits || github.sha) }}

# Two jobs, one per trigger family.
# pick: every fix merged to main is cherry-picked with -x onto each stabilizing release branch.
#   Each push to main rescans every target since its cut (backport.py --rescan) and picks whatever no pick or
#   decline trailer names there, so a push run that a newer push replaces while pending costs nothing.
#   A dispatch with `commits` picks only those; a rescan never picks a held fix, so a push never replaces a dispatch. Every pick is its own PR with the original PR's title;
#   the bot squash-merges clean ones in the same run, conflicts stay open for a person.
#   Security/critical fixes reach stabilized branches only with confirm_stabilized. Never builds.
# record: people land a backport conflict PR with the normal buttons (resolve, one approving review, Squash and merge)
#   or close it. The bot records what happened (backport_merge.py --pr N):
#   merged -> label backport-merged, head deleted; closed unmerged -> a decline: empty decline commit on the base
#   (the closer's close comment is the reason), label backport-declined, head kept so the PR can be reopened;
#   a head with no commit past the base declines and deletes nothing: the bot comments once that a person deletes the
#   head or re-picks onto it, and how to decline by hand;
#   reopened -> label backport-conflict. Reopen and merge undoes a decline: the newest trailer on the line wins.
#   pull_request_target, not pull_request: GitHub runs no pull_request workflow on a PR that conflicts with its base
#   at the git level (no merge ref), and a conflict PR whose base later changed the same lines is one.
#   pull_request_target runs the base line's copy of this file, so it fires only on lines that carry it. Safe:
#   the job checks out main and never runs head code; backport_merge.py refuses a head that is not
#   backport/X.Y/<sha7> into release/X.Y (an expression cannot match that pattern, so the job filter is coarser). A failed record run is recovered with "Re-run jobs".
#   Scripts run from main's tree.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed, reopened]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      commits:
        description: "Fixes to backport (PR numbers or SHAs)"
        type: string
        required: false
      confirm_stabilized:
        description: "Include stable branches (security/critical only)"
        type: boolean
        default: false
      branches:
        description: "Only these branches (optional)"
        type: string
        required: false

jobs:
  pick:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backport.py PICK_TIMEOUT: a head with no PR younger than this belongs to a running run
    permissions:
      contents: read
    concurrency:
      # Push runs are serialised, and a newer push replaces a pending one: the next rescan picks what it would have.
      # A dispatch is its own group, never replaced: it may carry confirm_stabilized, which no rescan has. It can run
      # beside a push run or another dispatch. Two runs picking one fix onto one line race on its pick head: the
      # loser's push is rejected (retried; skipped if the winner already landed the pick, else a failed row), and a
      # head with no open PR yet reads as pending until it is older than timeout-minutes. If the winner merged and
      # deleted the head first, the loser can open a second pick PR for a fix already on the line. A squash after
      # the base moved is retried by backport_merge.squash.
      group: backport-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'rescan' }}
    steps:
      - name: Inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo '::error::Run this from main ("Use workflow from: main")'; exit 1; fi
          if [ -z "$COMMITS" ]; then echo "::error::Set commits: the PR numbers or SHAs to backport"; exit 1; fi

      # The repo's GitHub App, as in create-release.yaml: a GITHUB_TOKEN push or PR starts no workflow.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUSH_TO_MAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_TO_MAIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # relmgr needs full history and tags
          token: ${{ steps.bot.outputs.token }} # picks are pushed as the bot

      - name: Main tip
        # A late push run checks out its event sha as origin/main; rescan the real tip instead.
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main

      - name: Branch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scripts run from outside the tree: the pick checks out release branches, which predate them.
          cp .github/release/*.py "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/relstate.py" > "$RUNNER_TEMP/state.json"

      - name: Pick
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_BOT_APP_SLUG: ${{ steps.bot.outputs.app-slug }} # a leftover pick PR is squashed only if this App opened it
          COMMITS: ${{ inputs.commits }}
          CONFIRM: ${{ inputs.confirm_stabilized }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then args=(--rescan); else args=(--commits "$COMMITS"); fi
          if [ "$CONFIRM" = true ]; then args+=(--confirm-stabilized); fi
          python3 "$RUNNER_TEMP/backport.py" --state "$RUNNER_TEMP/state.json" "${args[@]}" --branches "$BRANCHES"

  record:
    if: >-
      github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.head.ref, 'backport/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: backport-pr-${{ github.event.pull_request.number }} # its own group: in a pick group it could replace a pending pick run
    steps:
      # The repo's GitHub App, as in create-release.yaml: a GITHUB_TOKEN push or PR starts no workflow.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUSH_TO_MAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_TO_MAIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # the decline reads the pick from the head and the base's history
          token: ${{ steps.bot.outputs.token }}

      - name: Record the close
        # Each release line runs its own copy of this job with main's script, so main's backport_merge.py must
        # accept the env and arguments of every live line's copy.
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }} # labels, comments, the decline commit and the head delete
          RELEASE_BOT_APP_SLUG: ${{ steps.bot.outputs.app-slug }} # the pick PR's author must be this App
          PR: ${{ github.event.pull_request.number }}
          # who closed it: their close comment is the decline reason
          SENDER: ${{ github.event.sender.login }}
        run: python3 .github/release/backport_merge.py --pr "$PR" --sender "$SENDER"
