name: Frontend CI (Biome, typecheck, tests)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  # No `paths` on pull_request: an untriggered workflow reports no check run,
  # so a required check would wait forever on non-frontend PRs. Filtering is
  # done by the `changes` job instead — a job skipped via `if:` reports
  # `skipped`, which satisfies a required check. Same pattern as ci-test.yaml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      # Push is already path-filtered by its trigger, so force true off-PR.
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check for frontend changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            frontend:
              - "frontend/**"

  biome-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.3.13"

      - name: Run Biome CI
        id: biome
        working-directory: frontend
        continue-on-error: true
        run: |
          biome ci src/ 2>&1 | tee biome-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Generate lint report
        if: always()
        working-directory: frontend
        run: |
          echo "## Frontend Lint Report (Biome)" >> biome-report.md
          echo "" >> biome-report.md

          if [ "${{ steps.biome.outputs.exit_code }}" = "0" ]; then
            echo "✅ **All checks passed!** No linting or formatting issues found." >> biome-report.md
          else
            echo "❌ **Issues found.** Please fix the following problems:" >> biome-report.md
            echo "" >> biome-report.md
            echo '```' >> biome-report.md
            cat biome-output.txt >> biome-report.md
            echo '```' >> biome-report.md
            echo "" >> biome-report.md
            echo "Run \`cd frontend && bun run check:fix\` to auto-fix issues." >> biome-report.md
          fi

      - name: Render lint report to PR
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        if: always() && hashFiles('frontend/biome-report.md') != '' && github.event.pull_request.head.repo.fork == false
        with:
          header: frontend-lint-results
          recreate: true
          path: frontend/biome-report.md

      - name: Output lint report to job summary
        if: always() && hashFiles('frontend/biome-report.md') != ''
        run: cat frontend/biome-report.md >> $GITHUB_STEP_SUMMARY

      - name: Fail if Biome found issues
        if: steps.biome.outputs.exit_code != '0'
        run: exit 1

  # Vite/esbuild strip types without checking them, so a green build says
  # nothing about the .tsx files — tsc is the only thing that does.
  typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: frontend
        # No dependency lifecycle scripts: nothing here needs them (tsc and
        # esbuild ship per-platform binaries as optionalDependencies).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: bun run typecheck

  # ci-test.yaml runs the same suite as the rig's `frontend` group, but its
  # tiers skip frontend-only PRs; this job is what gates those.
  vitest:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: frontend
        # No dependency lifecycle scripts: nothing here needs them (tsc and
        # esbuild ship per-platform binaries as optionalDependencies).
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Vitest
        working-directory: frontend
        # The package script, so the lockfile's vitest runs, never a fetched one.
        run: bun run test --run
