# Debug layer - adds debugpy to services
#
# Usage:
#   VERSION=test docker compose -f docker-compose.yaml -f compose.override.yaml -f compose.debug.yaml watch
#
# Debug Port Map:
#   5678 - backend
#   5679 - runner
#   5680 - platform-service
#   5682 - worker-pg-fileproc
#   5683 - worker-pg-callback
#   5684 - worker-pg-orchestrator-api
#   5685 - worker-pg-orchestrator-general
#   5686 - worker-pg-notification
#   5687 - worker-log-stream-consumer
#   5688 - worker-pg-scheduler

services:
  #########################################################################################################
  # Python Services with debugpy

  backend:
    ports:
      - "5678:5678"
    command: [
      "uv run python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 .venv/bin/gunicorn
        --bind 0.0.0.0:8000
        --workers 1
        --threads 2
        --worker-class gthread
        --log-level debug
        --timeout 900
        --graceful-timeout 5 backend.wsgi:application"
    ]

  runner:
    ports:
      - "5679:5679"
    command: [
      "uv run python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5679 .venv/bin/gunicorn
        --bind 0.0.0.0:5002
        --workers 1
        --threads 2
        --worker-class gthread
        --log-level debug
        --timeout 900
        --access-logfile -
        --graceful-timeout 5 unstract.runner:app"
    ]

  platform-service:
    ports:
      - "3001:3001"
      - "5680:5680"
    command: [
      "uv run python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5680 .venv/bin/gunicorn
        --bind 0.0.0.0:3001
        --workers 1
        --threads 2
        --worker-class gthread
        --log-level debug
        --timeout 900
        --access-logfile -
        --graceful-timeout 5 unstract.platform_service.run:app"
    ]

  #########################################################################################################
  # V2 Workers with debugpy
  # Using --pool=threads for debugpy compatibility (prefork doesn't work well with debugpy)

  worker-pg-fileproc:
    user: root
    ports:
      - "5682:5682"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5682 -m celery
        -A worker worker
        --queues=file_processing,api_file_processing,file_processing_priority
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-pg-callback:
    user: root
    ports:
      - "5683:5683"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5683 -m celery
        -A worker worker
        --queues=file_processing_callback,api_file_processing_callback
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-pg-orchestrator-api:
    user: root
    ports:
      - "5684:5684"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5684 -m celery
        -A worker worker
        --queues=celery_api_deployments
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-pg-orchestrator-general:
    user: root
    ports:
      - "5685:5685"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5685 -m celery
        -A worker worker
        --queues=celery
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-pg-notification:
    user: root
    ports:
      - "5686:5686"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5686 -m celery
        -A worker worker
        --queues=notifications,notifications_webhook,notifications_email,notifications_sms,notifications_priority
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-log-stream-consumer:
    user: root
    ports:
      - "5687:5687"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5687 -m celery
        -A worker worker
        --queues=celery_log_task_queue,celery_periodic_logs
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]

  worker-pg-scheduler:
    user: root
    ports:
      - "5688:5688"
    entrypoint: ["bash", "-c"]
    command: [
      "uv run python -m debugpy --listen 0.0.0.0:5688 -m celery
        -A worker worker
        --queues=scheduler
        --loglevel=INFO
        --pool=threads
        --concurrency=2
        --prefetch-multiplier=1
        --without-gossip
        --without-mingle
        --without-heartbeat"
    ]
