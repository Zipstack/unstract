[project]
name = "unstract-x2text-service"
version = "0.1.0"
description = "X2TEXT Service"
authors = [{ name = "Zipstack inc", email = "devsupport@zipstack.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "flask>=3.1.3",
    "python-dotenv~=1.2.2",
    "requests>=2.33.0",
    "peewee>=3.17.0",
    "psycopg2-binary~=2.9",
    # Shared SSRF guard for the tenant-supplied unstructured-url
    "unstract-core",
]

[dependency-groups]
deploy = [
    "gunicorn[gevent]~=23.0",
    # OpenTelemetry for tracing and profiling
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
]
dev = ["debugpy>=1.8.14"]

[tool.uv.sources]
unstract-core = { path = "../unstract/core", editable = true }
